<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" role="img" aria-label="معاينة قسم الأسئلة الشائعة">
  <rect width="720" height="280" rx="18" fill="#f7f8fa"/>
  <text x="360" y="44" text-anchor="middle" font-family="Arial,sans-serif" font-size="22" font-weight="700" fill="#222">الأسئلة الشائعة</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#333">
    <rect x="72" y="68" width="576" height="48" rx="10" fill="#fff" stroke="#dfe3e8"/><text x="600" y="98" text-anchor="end">كم يستغرق تجهيز الطلب؟</text><text x="102" y="99" font-size="24" fill="#153c35">+</text>
    <rect x="72" y="126" width="576" height="80" rx="10" fill="#fff" stroke="#dfe3e8"/><text x="600" y="156" text-anchor="end">هل يمكن استبدال المنتج؟</text><text x="102" y="158" font-size="24" fill="#153c35">−</text><text x="600" y="184" text-anchor="end" font-size="13" fill="#777">تعرّف على سياسة الاستبدال من صفحة السياسات.</text>
    <rect x="72" y="216" width="576" height="48" rx="10" fill="#fff" stroke="#dfe3e8"/><text x="600" y="246" text-anchor="end">ما طرق الدفع المتاحة؟</text><text x="102" y="247" font-size="24" fill="#153c35">+</text>
  </g>
</svg>
